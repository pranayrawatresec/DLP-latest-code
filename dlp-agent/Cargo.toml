[package]
name = "dlp-agent"
version = "0.1.0"
edition = "2021"
description = "On-premise DLP Windows agent — Phase 2: secure channel (enrollment + mTLS check-in)"

[dependencies]
# Crypto: pure-Rust RSA keygen + PKCS#10 CSR (no C toolchain; deployable anywhere)
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8"
x509-cert = { version = "0.2", features = ["builder", "pem"] }
der = { version = "0.7", features = ["pem"] }

# HTTP + mutual TLS (rustls backend — pure Rust, pins our CA, presents client cert)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Config, serialization, logging, errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# IDM fingerprinting (detect/) — must mirror the server's normalize() exactly:
# NFKC, plus Unicode general categories L*/N* to match JS /\p{L}\p{N}/u.
# Both pure Rust, table-only crates.
unicode-normalization = "0.1"
unicode-properties = "0.1"

# Text extraction (detect/extract.rs) — same bounded format set as the
# server's lib/extractText.js. zip with default features OFF: deflate only
# (flate2/zlib-rs, pure Rust), no aes/bzip2/zstd — we refuse encrypted
# archives rather than decrypt them. pdf-extract = text layer only, no OCR;
# pure-Rust dependency tree (lopdf + font/cmap parsers).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.0"

[target.'cfg(windows)'.dependencies]
# DPAPI (machine-scope) to protect the private key at rest, and the Windows
# service lifecycle.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    # USB channel (src/usb): volume enumeration, IOCTL device identity,
    # WriteProtect registry enforcement, and volume dismount.
    "Win32_Storage_FileSystem",       # GetLogicalDrives, GetDriveTypeW, CreateFileW
    "Win32_System_Ioctl",             # IOCTL_STORAGE_QUERY_PROPERTY, FSCTL_* codes
    "Win32_System_IO",                # DeviceIoControl
    "Win32_System_Registry",          # RegSetValueExW (WriteProtect)
    # Kernel minifilter port client (src/kguard): FilterConnectCommunicationPort,
    # FilterGetMessage, FilterReplyMessage + FILTER_MESSAGE/REPLY_HEADER.
    "Win32_Storage_InstallableFileSystems",
    # Clipboard channel (src/clipboard): OpenClipboard/GetClipboardData/
    # EmptyClipboard/AddClipboardFormatListener + the message-only window pump.
    "Win32_System_DataExchange",       # clipboard read/write + format listener
    "Win32_System_Memory",             # GlobalLock/GlobalSize/GlobalAlloc on HGLOBAL
    "Win32_UI_WindowsAndMessaging",    # message-only window + WM_CLIPBOARDUPDATE pump
] }
windows-service = "0.7"

