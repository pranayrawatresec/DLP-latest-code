[package]
name = "dlp-agent"
version = "0.1.0"
edition = "2021"
description = "On-premise DLP Windows agent — Phase 2: secure channel (enrollment + mTLS check-in)"

[dependencies]
# Crypto: pure-Rust RSA keygen + PKCS#10 CSR (no C toolchain; deployable anywhere)
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8"
x509-cert = { version = "0.2", features = ["builder", "pem"] }
der = { version = "0.7", features = ["pem"] }

# HTTP + mutual TLS (rustls backend — pure Rust, pins our CA, presents client cert)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Config, serialization, logging, errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decode base64 file bytes the browser extension sends for binary uploads
# (scan_bytes) so the host content-inspects PDFs/DOCX like an endpoint DLP.
base64 = "0.22"
toml = "0.8"
anyhow = "1"

# Encrypt-on-write envelope (src/crypto): AES-256-GCM `.dlpenc` sealing for
# trusted destinations; zeroize scrubs DEKs/KEKs from memory on drop.
# Approved additions per ENCRYPT-ON-WRITE-IMPLEMENTATION.md §2 — ONLY these two.
aes-gcm = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# IDM fingerprinting (detect/) — must mirror the server's normalize() exactly:
# NFKC, plus Unicode general categories L*/N* to match JS /\p{L}\p{N}/u.
# Both pure Rust, table-only crates.
unicode-normalization = "0.1"
unicode-properties = "0.1"

# Text extraction (detect/extract.rs) — same bounded format set as the
# server's lib/extractText.js. zip with default features OFF: deflate only
# (flate2/zlib-rs, pure Rust), no aes/bzip2/zstd — we refuse encrypted
# archives rather than decrypt them. pdf-extract = text layer only, no OCR;
# pure-Rust dependency tree (lopdf + font/cmap parsers).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.0"

# ML document classification (src/ml) — the second, independent detection signal.
# TWO dependencies, and only two; both are load-bearing and neither has a
# realistic in-house substitute.
#
# tokenizers: the SAME Rust crate HuggingFace's Python `tokenizers` package binds
#   to, so `backbone/tokenizer.json` produces byte-identical ids to the reference
#   pipeline the golden vectors were generated from. A hand-rolled WordPiece would
#   diverge silently on some normalizer corner (accents, CJK, ß) and change the
#   model's answer with no error anywhere. default-features = false drops the C++
#   `esaxx-rs/cpp` suffix-array build, the `indicatif` progress bar and the
#   `hf-hub` HTTP client — a model download path has no business in an air-gapped
#   agent. `onig` is re-enabled because tokenizers 0.20 compiles
#   `src/utils/onig.rs` unconditionally; it is only linked, never used by the
#   BertNormalizer/WordPiece path this model needs.
tokenizers = { version = "0.20.4", default-features = false, features = ["onig"] }

# ort: bindings to Microsoft's ONNX Runtime — the only way to execute the graph.
#   Pinned EXACTLY: an ONNX Runtime API bump silently changes numerics/threading
#   and the golden vectors are the contract. default-features = false removes
#   `download-binaries` (a build-time HTTPS fetch from pyke.io — unacceptable in a
#   defence build) together with its ureq/native-tls build tree, and `ndarray`
#   (we feed flat Vec<i64> and read a flat &[f32]). `load-dynamic` means the agent
#   dlopen()s onnxruntime.dll at runtime instead of linking it, so the native
#   library is a file we ship and can re-sign, not a blob baked into the exe.
#   `api-17` asks for the ONNX Runtime 1.17 API surface, the oldest that serves
#   this graph, so any ORT >= 1.17 we ship satisfies it.
#   See the build recipe at the top of src/ml/engine.rs.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-17"] }

[target.'cfg(windows)'.dependencies]
# DPAPI (machine-scope) to protect the private key at rest, and the Windows
# service lifecycle.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    # USB channel (src/usb): volume enumeration, IOCTL device identity,
    # WriteProtect registry enforcement, and volume dismount.
    "Win32_Storage_FileSystem",       # GetLogicalDrives, GetDriveTypeW, CreateFileW
    "Win32_System_Ioctl",             # IOCTL_STORAGE_QUERY_PROPERTY, FSCTL_* codes
    "Win32_System_IO",                # DeviceIoControl
    "Win32_System_Registry",          # RegSetValueExW (WriteProtect)
    # Kernel minifilter port client (src/kguard): FilterConnectCommunicationPort,
    # FilterGetMessage, FilterReplyMessage + FILTER_MESSAGE/REPLY_HEADER.
    "Win32_Storage_InstallableFileSystems",
    # Clipboard channel (src/clipboard): OpenClipboard/GetClipboardData/
    # EmptyClipboard/AddClipboardFormatListener + the message-only window pump.
    "Win32_System_DataExchange",       # clipboard read/write + format listener
    "Win32_System_Memory",             # GlobalLock/GlobalSize/GlobalAlloc on HGLOBAL
    "Win32_UI_WindowsAndMessaging",    # message-only window + WM_CLIPBOARDUPDATE pump
    # Network egress control (src/netfilter): user-mode WFP BLOCK/PERMIT filters
    # at ALE_AUTH_CONNECT_V4/V6, plus process enumeration for remote-tool detect.
    "Win32_NetworkManagement_WindowsFilteringPlatform", # FwpmEngineOpen0/FilterAdd0/FWPM_FILTER0
    "Win32_NetworkManagement_IpHelper", # owner-PID→conn table (follow-on conn enumeration)
    "Win32_System_Rpc",                 # GUID/auth types referenced by the Fwpm* signatures
    "Win32_Security",                   # PSECURITY_DESCRIPTOR + SID (Fwpm*Add0 are security-gated)
    "Win32_System_Threading",           # OpenProcess/TerminateProcess/QueryFullProcessImageNameW/CreateProcessAsUserW/ProcessIdToSessionId
    "Win32_System_ProcessStatus",       # EnumProcesses (remote-tool process enumeration)
    # Read-deny allowlist posture (src/exfil): verify a process image's
    # Authenticode signature and extract the signer publisher so the
    # sanctioned-reader allowlist can match by publisher (spoof-resistant id).
    "Win32_Security_WinTrust",          # WinVerifyTrust + WINTRUST_DATA/WINTRUST_FILE_INFO
    "Win32_Security_Cryptography_Catalog", # CryptCATAdmin* — resolve the signer of
                                        # catalog-signed OS binaries (cmd/notepad/…),
                                        # not just embedded-signed apps.
    # Endpoint "blocked by DLP" toast (src/notify): render a native Windows toast
    # (WinRT) and, from the Session-0 service, spawn the toast into the interactive
    # user session (WTSQueryUserToken + CreateProcessAsUserW + CreateEnvironmentBlock).
    "UI_Notifications",                  # ToastNotificationManager / ToastNotification (WinRT)
    "Data_Xml_Dom",                      # XmlDocument for the toast payload (WinRT)
    "Win32_System_RemoteDesktop",        # WTSGetActiveConsoleSessionId/WTSQueryUserToken/WTSQuerySessionInformationW
    "Win32_System_Environment",          # CreateEnvironmentBlock/DestroyEnvironmentBlock
    "Win32_System_StationsAndDesktops",  # (lpDesktop "winsta0\\default" for CreateProcessAsUserW)
] }
windows-service = "0.7"

