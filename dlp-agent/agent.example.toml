# DLP agent configuration.
# In production the MSI installer writes this to C:\ProgramData\DLPAgent\agent.toml
# and provisions ca-cert.pem alongside it. The enrollment token is supplied
# per rollout wave (one token, sized to the number of PCs).

# The management server's mTLS listener. Its host MUST appear in the server
# certificate's SAN, or CA-pinned verification will (correctly) reject it.
server_url = "https://dlp-server.internal:8443"

# One-time enrollment token (from the console: Enrollment tokens → Create).
# Only used until the agent has its certificate; ignored afterwards.
enrollment_token = "dlpenr_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# CA certificate shipped with the installer — the trust anchor the agent pins
# to verify the server from the very first connection (including enrollment).
ca_cert_path = "C:\\ProgramData\\DLPAgent\\ca-cert.pem"

# Where the agent stores its DPAPI-sealed identity and cached policy.
state_dir = "C:\\ProgramData\\DLPAgent"

# Fallback cadence; the server's response takes precedence.
checkin_interval_seconds = 300

# --- Kernel minifilter port client (usb-guard) + read-deny scope -------------
# The driver reads file content in-kernel and asks usb-guard for a verdict. The
# same watch-set doubles as the READ-DENY scope on fixed volumes: an
# exfil-channel process (remote tool / public-connection holder / VM worker)
# reading a file under these prefixes is content-classified and, if sensitive,
# DENIED the read. Removable/network volumes are always in scope.
[kguard]
# fail_block = true    # fail-secure: block when no verified bundle is cached
scan_fixed = true      # inspect fixed-volume (C:) reads/writes under watch_paths
watch_paths = ["\\Users", "\\Data"]
# exfil_read_block = true  # run the untrusted-reader tracker + push the set to
#   the driver so DlpPreRead can deny sensitive reads by untrusted processes.
#   Pair with the driver registry knobs below. Default false.
# exfil_posture = "allowlist"  # WHICH processes get pushed:
#   "blocklist" (default, unchanged) — exfil channels chosen by remote-tool
#     signature + public-connection behaviour + loaded hypervisor. Robust against
#     nothing new; turning read-deny on changes nothing else.
#   "allowlist" — every process NOT on the sanctioned-reader allowlist
#     ([[trusted_readers]] below, merged with the console-authored list) is an
#     untrusted reader. Scales against unknown tools (a never-seen uploader isn't
#     on the allowlist ⇒ denied at the read). RECOMMENDED — but always roll out
#     monitor → measure → enforce, and curate the allowlist first (an empty
#     allowlist pushes NOTHING, fail-safe toward availability).
# removable_write_block_at = 0.15  # containment ceiling for BLOCKING a sensitive
#   file copied to a NON-whitelisted removable device (WRITE path). Also blocks on
#   any EDM hit or coverage >= coverage_block_at. DISTINCT from block_at (0.30),
#   which still drives the read-scan and trusted-side decide_seal bands. Default 0.15.
# sealer_health_timeout_secs = 10  # run-endpoint: the guard stands aside for the
#   in-process sealer only if the sealer marked itself alive within this window AND
#   a keyring is present; otherwise a seal-eligible write is BLOCKED (fail secure).
#   Default 10.
#
# Read-deny MASTER SWITCH + fail policy are NOT set here — they are driver
# registry DWORDs under the service key (read in DriverEntry, like FailMode), so
# the frozen v2 wire protocol is untouched. The installer/INF sets:
#   ExfilReadBlockEnabled = 1   (0 = filesystem/USB protection only)
#   ExfilReadFailBlock    = 1   (deny an exfil PID's read of unverifiable
#                                content; fail-secure default)

# --- Sanctioned-reader allowlist (read-deny "allowlist" posture) -------------
# The applications ALLOWED to read sensitive content locally. Every process NOT
# matching one of these (and not a known remote tool / VM worker) is treated as
# an untrusted reader and denied the read of sensitive files. Only used when
# [kguard] exfil_posture = "allowlist". Merged (union) with the console-authored
# list synced over mTLS, so central management is preferred; these locals are a
# fallback / air-gapped-site convenience.
#
# Match by ONE of (priority publisher → path → name):
#   publisher = "..."  Authenticode signer name — spoof-resistant (malware can't
#                      sign as Microsoft). Covers embedded- AND catalog-signed
#                      binaries. NOTE (verified on real Windows): Microsoft signs
#                      under SEVERAL names — "Microsoft Windows", "Microsoft
#                      Windows Publisher", AND "Microsoft Corporation" — so to
#                      cover the OS by publisher you must list all three. It is
#                      usually simpler to cover the OS with a Windows PATH rule
#                      (below) and reserve publisher rules for specific third-party
#                      vendors (e.g. "Adobe Inc.", "Google LLC").
#   path      = "..."  image path prefix at a path boundary (non-user-writable
#                      dirs like Program Files / Windows are a strong signal).
#   name      = "..."  image base name — weakest; pair with WDAC/AppLocker.
#
# A minimal starter set (adapt per enclave — inherit your AppLocker/WDAC list):
# [[trusted_readers]]
# path = "C:\\Windows"                    # the OS (svchost, explorer, indexer, ...)
# note = "Windows"
# [[trusted_readers]]
# path = "C:\\Program Files\\Microsoft Office"
# note = "Office"
# [[trusted_readers]]
# path = "C:\\Program Files\\Adobe"       # the approved PDF reader
# note = "Acrobat"
# [[trusted_readers]]
# publisher = "Microsoft Corporation"     # Defender, Edge, and other MS-signed apps
# [[trusted_readers]]
# name = "dlp-agent.exe"                  # the agent itself (reads files to scan)
# note = "DLP agent"
# Remember AV + backup + your sanctioned sync client also read every file — add
# them (by publisher or install path) or they will be denied.

# --- Network-egress default-deny ---------------------------------------------
# This allow-list blocks ANY process to an unapproved dest. Under
# `--enforce allowlist` it MUST permit the agent's own lifelines or the agent
# cuts itself off: the management server host:port and the DNS resolver(s), at
# minimum.
[netfilter]
mode = "monitor"        # NEVER default-deny by config; opt in via --enforce allowlist

[[netfilter.rules]]
cidr = "10.20.0.5/32"   # management server (adjust to your mTLS listener)
port = 8443
action = "permit"
note = "mgmt-server mTLS"

[[netfilter.rules]]
cidr = "10.20.0.53/32"  # internal DNS resolver
port = 53
action = "permit"
note = "DNS"

# --- USB channel + trusted-destination encryption (encrypt-on-write §3.2) ----
# Whitelisted destinations are not a policy hole: `action = "encrypt"` means
# writes proceed but land as sealed `.dlpenc` envelopes (AES-256-GCM, org-held
# keys) only enrolled endpoints can open. Per encrypt rule:
#   mode   = "encrypt_all"        every file is sealed (courier-stick mode)
#          | "encrypt_sensitive"  verdict-banded; DEFAULT when omitted
#   key_id = KEK id (free-form string, e.g. "class-internal/v1");
#            omitted ⇒ [crypto] default_key_id
#   on_block_band = "block"       BLOCK-band verdicts keep blocking (DEFAULT —
#                                 whitelisting never weakens the block threshold)
#                 | "seal"        opt-in: block-band files leave this device
#                                 armoured (.dlpenc) instead of blocked; they
#                                 never leave in plaintext either way
# The channel idles unless `enabled = true` (opt-in, like every channel).
[usb]
# enabled = true
# default_action = "read_only"    # fail-secure default for unmatched devices

[[usb.rules]]
match_serial = "0401396FBBF0C89E"
action = "encrypt"
mode = "encrypt_all"
note = "site-A courier stick"

[[usb.rules]]
match_vid = "0951"
match_pid = "1666"
action = "encrypt"              # mode defaults to encrypt_sensitive;
                                # key_id defaults to [crypto] default_key_id
# on_block_band = "seal"        # uncomment to seal (not block) even the most
                                # sensitive files onto THIS device

# --- Trusted-destination encryption keys (encrypt-on-write §3.2) -------------
[crypto]
default_key_id = "class-internal/v1"  # KEK id sealed files reference (free-form)
encrypt_at = 0.05                     # lower edge of the seal band (encrypt_sensitive)
# block_at / coverage_block_at are read from [kguard] — one source of truth;
# whitelisting a destination NEVER weakens the block thresholds.
# keyfile = "C:\\ProgramData\\DLPAgent\\dev-keyring.json"  # DEV ONLY until
#                                 server key sync (M6); keep git-ignored.

# --- Web-upload trusted origins (browser channel, M7) ------------------------
# Uploads to these origins are sealed instead of blocked. Same mode/key_id
# semantics as USB encrypt rules.
[webupload]
trusted_origins = [
  { origin = "https://mail.internal.example", mode = "encrypt_sensitive" },
]

# --- Endpoint "blocked by DLP" toast -----------------------------------------
# On any block (USB / clipboard / web-upload / network), the end user gets a
# native Windows toast so they know THEIR machine's DLP stopped it. This is UX
# only — enforcement already happened; the toast is best-effort and never gates a
# block. Verbosity is a deliberate defence knob: `standard` shows file + channel
# + a local reference but NEVER the detection internals (which document/score/
# classifier — that is evasion intel for an insider); `minimal` drops file+ref;
# `covert` suppresses the toast entirely (block + log only) for counter-insider
# sites. For the toast to appear in the Action Center the `aumid` must be a
# REGISTERED AppUserModelID — the installer drops a Start-Menu shortcut carrying
# it. From the Session-0 service the agent spawns `dlp-agent toast ...` into the
# interactive session (CreateProcessAsUserW) to render it.
[notify]
enabled = true              # false == covert (block + log, no toast)
mode = "standard"           # standard | minimal | covert
org_name = "Data Loss Prevention"
aumid = "Resec.DLP.Agent"   # must match the installer-registered shortcut AUMID
dedup_secs = 5              # suppress a repeat block of the same (channel,file) within N s
max_per_minute = 20         # global storm cap (0 = unlimited)

# --- ML document classification ----------------------------------------------
# The SECOND detection signal, beside IDM/EDM fingerprinting. Fingerprinting
# answers "does this contain material from a REGISTERED protected document";
# the classifier answers "what business function does this document serve",
# against the frozen 29-label V6.2.01 taxonomy. A file is sensitive when EITHER
# fires — each covers the other's blind spot, and fingerprinting cannot see a
# document nobody registered.
#
# SPLIT OF AUTHORITY. This section is the LOCAL half only: where the model lives
# on this endpoint and what one inference may cost. WHETHER the classifier
# contributes at all — which of the 29 classes count as sensitive, the confidence
# floor, audit vs block, fail-secure posture — is authored in the console and
# delivered over mTLS at GET /agent/ml-policy. With no class marked sensitive the
# classifier is inert no matter what is set here.
#
# Inference runs ON THIS PC: document text never leaves the endpoint, and it
# keeps working with the server unreachable. Cost is roughly 10 ms for a short
# note and a few hundred ms for a long PDF, so the model runs on the write /
# USB / clipboard / browser-upload paths but NOT on the synchronous kernel
# read-deny up-call (see ML-CLASSIFICATION-RUNBOOK.md).
[ml]
enabled = true              # LOCAL kill switch. false = never classify on this
                            # endpoint, whatever the console policy says.

# The three artifacts, staged by scripts\stage-ml-model.ps1. The sidecar is
# DERIVED (model_path + ".json") and is deliberately not configurable — the label
# space and chunk geometry must travel with the weights so they cannot drift.
model_path     = 'C:\dlp\model\model.onnx'
tokenizer_path = 'C:\dlp\model\tokenizer.json'

# DEVELOPER BENCH: to run `scan` / `classify` straight out of the repository
# without staging anything, point at Document_classification\ instead. The layout
# there already matches what the resolver expects (model\, backbone\, runtime\):
#
#   model_path     = 'D:\DLP_GUIDE\Document_classification\model\model.onnx'
#   tokenizer_path = 'D:\DLP_GUIDE\Document_classification\backbone\tokenizer.json'
#
# and drop onnxruntime.dll at Document_classification\runtime\ — copy it from
# <site-packages>\onnxruntime\capi\onnxruntime.dll after `pip install onnxruntime`.
# Without it every ONNX test SKIPS while still printing "ok"; run the suite with
# DLP_ML_STRICT=1 to turn that skip into a failure.

# ONNX Runtime is NOT linked in and NOT downloaded at build time (a defence build
# must be reproducible offline). It is resolved at first use, in this order:
#   1. <ml root>\runtime\onnxruntime.dll   <- the shipped location; ALWAYS use it
#   2. $ORT_DYLIB_PATH
#   3. the bare file name, via the OS loader path
# <ml root> is the PARENT of the model directory, so the line above implies
# C:\dlp\runtime\onnxruntime.dll. Do not rely on step 3: with nothing staged the
# loader binds whatever onnxruntime.dll it finds first on the machine, which
# surfaces as a confusing "graph_optimization_level is not valid" at load.

max_chars     = 0           # 0 = accept the bound the model declares (200000).
                            # Any other value must MATCH it or the classifier
                            # refuses to load: the bound applies before a single
                            # token exists, so a lower one would silently shorten
                            # every document before the model saw it.
max_chunks    = 0           # 0 = unlimited = reference-faithful. A non-zero cap
                            # bounds inference cost by classifying only the
                            # document's LEADING chunks — a real behaviour
                            # change, so a capped result carries chunksTruncated.
intra_threads = 1           # ONNX Runtime threads per operator. One by default:
                            # this runs while an employee works, and a classifier
                            # that pegs every core is a support ticket.

# --- ML coverage pipeline (at-creation / at-rest / on-demand) -----------------
# THE PROBLEM. The kernel READ up-call is synchronous: the driver blocks the
# reading thread, hands us up to 4 MiB of the file and wants an answer inside
# 500 ms, and eight consecutive timeouts trip the IPC breaker for the WHOLE
# machine. A DistilBERT pass costs 10-100 ms typically and ~640 ms on a long
# document, and the guard's message loop is single-threaded — so the model may
# NEVER run on that path. Until now that meant a file authored on C: this morning
# had never met the model at all, and RustDesk/AnyDesk/RDP reading it out was
# adjudicated on fingerprints alone. Fingerprinting cannot see a document nobody
# registered.
#
# THE FIX, and what these knobs bound. The model runs OFF the hot path and
# deposits its answer in a content-keyed cache; the read path does a microsecond
# lookup. Three producers fill it:
#   at creation  a directory watcher classifies a file once it stops being written
#   at rest      a throttled walker backfills what predates the agent
#   on demand    a read-path miss enqueues the bytes the kernel already gave us,
#                so the NEXT read of that content hits
# The cache stores what the MODEL said (label + score), never what the POLICY
# concluded — so marking a new class sensitive in the console changes the whole
# estate's behaviour on the next read, with nothing to re-scan.
#
# NONE OF IT RUNS WHILE THE CONSOLE POLICY IS INERT. With no class marked
# sensitive there is no cache file, no threads and no disk traffic: the endpoint
# behaves exactly as it did before this feature existed. It is safe to deploy
# ahead of the console change that turns it on.

# cache_max_entries = 200000   # hard cap on cached verdicts (~tens of MB: a record
                               # is a 32-byte hash, a label and a few numbers —
                               # never a path, a name or content). Eviction is LRU
                               # and costs coverage, never safety: a missing entry
                               # is a MISS, and a miss can never mean "not
                               # sensitive".
# queue_capacity = 256         # depth of the on-demand hand-off. The enqueue never
                               # waits (it happens on the kernel message loop); a
                               # full queue drops its OLDEST job and counts it.
                               # A non-zero drop count means this endpoint is
                               # missing coverage, not merely that it is busy.
# watch_enabled = true         # at-creation watcher. The cheapest producer — it
                               # only looks at files somebody actually touched.
# walk_enabled  = true         # at-rest walker. Also the component that earns the
                               # right to turn on denyUnclassified (below).
# walk_files_per_minute = 120  # walker ceiling. Two files a second sounds timid
                               # and is deliberate: the cost per file is a 4 MiB
                               # read + a text extraction (a PDF or .docx is a
                               # decompress plus a parse) + the forward pass, on a
                               # PC somebody is using. At 120/min a 100k-file
                               # profile is covered in about fourteen hours — one
                               # overnight — for a backfill that happens once.
                               # Raise it for a scripted pre-deployment sweep on
                               # an idle machine; do not raise it fleet-wide to
                               # "finish sooner". The walker throttles itself
                               # further when the disk is slow or the queue is deep.
                               # 0 = UNLIMITED — right for a scripted
                               # pre-deployment sweep on an idle machine, never
                               # for a live endpoint.
# walk_interval_hours = 6      # gap between full re-sweeps (0 keeps the 6 h
                               # default, it does not mean "sweep back-to-back").
                               # NOT how the cache
                               # stays correct (different bytes are a different
                               # key, so content change needs no invalidation) —
                               # it is for what the watcher structurally cannot
                               # see: files that landed while the service was
                               # stopped, a volume that was offline, an overflowed
                               # notification buffer.
# max_file_bytes = 67108864    # 64 MiB. Not a model-cost bound — only the first
                               # 4 MiB of any file is ever hashed or classified
                               # (that is all the driver ships, so that is all a
                               # producer may hash, or it would mint a cache key
                               # the read path can never match). It keeps the
                               # producers off VM images, mailbox archives and
                               # media a user may be streaming. A skipped file is
                               # not a hole: read it on an exfil path and the
                               # on-demand trigger classifies it there and then.

# scopes: WHICH TREES the watcher watches and the walker sweeps. Normally LEAVE
# THIS UNSET. The scopes are derived from the read-deny watch-set above
# ([kguard] watch_paths, itself pushed down from the console read-deny policy),
# because that set already says which files the driver adjudicates reads against
# and the entire point of this pipeline is to have an answer ready for exactly
# those reads. A second, separately-edited list would drift, and the drift would
# be silent and one-directional: files inside the driver's watch-set but outside
# these scopes get read-adjudicated with nothing in the cache — the coverage hole
# this feature exists to close.
#
# The derivation makes three translations:
#   * volume-relative -> absolute. `\Users` becomes `C:\Users`, anchored to the
#     system drive because that is the only fixed volume the agent attaches, and
#     therefore the only one whose reads ever up-call. Data on a second fixed
#     volume needs BOTH this override and the attach extended.
#   * wildcards -> their fixed prefix. `\Users\*\OneDrive` becomes `C:\Users`:
#     a superset, so coverage is never lost and the per-file filter throws the
#     extra away cheaply.
#   * nesting -> the outermost. `\Users` plus `\Users\Public` is ONE recursive
#     watch, not two.
# With watch_paths empty the fallback is the user-profile root, because an empty
# scope list would mean the producers never start and every read misses — a
# feature that looks deployed and does nothing.
#
# Scopes are read ONCE at service start: a later console change to watchPaths
# takes effect on the next service restart, not on the next resync.
# scopes = ['D:\Projects', 'E:\Share']

# --- denyUnclassified: NOT a local knob, and a staged rollout ----------------
# The one setting that can create NEW denials lives in the console (the ML policy
# at GET /agent/ml-policy), never here — an endpoint must not be able to widen
# its own enforcement by editing this file. It is off unless the console sends it
# on, including when the server is too old to know the field.
#
# What it does: on a read whose content is NOT in the cache, reply NOVERDICT so
# the driver fails safe per ExfilReadFailBlock and caches nothing, while the
# bytes go to the background classifier — so the retry a moment later is
# authoritative. Deny now, classify, self-heal.
#
# THE ROLLOUT ORDER IS NOT OPTIONAL:
#   1. DEPLOY the agent with the pipeline on and denyUnclassified OFF. Nothing
#      changes for anyone; the cache fills.
#   2. LET THE WALKER FINISH. It writes a completion record when every scope has
#      been swept; that record is the coverage evidence, and at 120 files/min it
#      is an overnight job, not a coffee break.
#   3. VERIFY coverage on real endpoints — cache entry counts, the walker's
#      completion record, a zero or near-zero on-demand drop count.
#   4. ENABLE it in the console, ideally on a pilot group first.
# Enabling it at step 1 denies the FIRST read of every legacy file on every
# endpoint at once. That is a fleet outage, not a control. Two more gates refuse
# to let it bite regardless: the console policy must be live, and the on-demand
# worker must be running — a denial nothing can ever clear is an outage with no
# security gain.
